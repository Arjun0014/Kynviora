# Continuous integration.
#
# Spec 21 requires, on every pull request: clean install, typecheck, lint/format, unit and
# component tests, runtime schema/contract tests, secret scan, dependency scan, and database
# migration validation.
#
# Every step runs its tool directly rather than through a pipe. Piping a checker into `tail`
# discards its exit code and silently turns a failing gate into a passing one - which happened
# once during development and is exactly what a CI gate exists to prevent.

name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails if the lockfile and package.json disagree, which is the lockfile
      # integrity check spec 14 requires in the supply-chain section.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The mobile app has its own compiler settings (JSX, React Native lib), so it is excluded
      # from the root tsconfig and checked separately.
      - name: Typecheck mobile app
        run: npm run typecheck:mobile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Includes the migration and RLS suite, which runs real PostgreSQL through PGlite - no
      # database service container needed (DEC-004).
      - name: Test
        run: npm test

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect every commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec 14: "Do not blindly run forceful dependency remediation that downgrades or breaks
      # the supported runtime. Risk-assess findings and document mitigations until a compatible
      # fix exists." So this reports and fails on high severity, and does not auto-fix.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-real-health-data:
    name: Synthetic data check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Spec 21 environment model: local, development and preview environments are
      # "fictional/synthetic only". This is a coarse guard, not a substitute for review - it
      # catches the obvious mistake of a real-looking identifier landing in a fixture.
      - name: Check fixtures are labelled synthetic
        run: |
          set -euo pipefail
          if ! grep -rq "synthetic" packages/fixtures/src; then
            echo "::error::Fixture package must label its data as synthetic (spec 21)."
            exit 1
          fi
          echo "Fixture synthetic labelling present."
